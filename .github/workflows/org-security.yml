name: Organization security
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: '9 1 * * 2'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  security:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: securelyprogramming/centralized-actions-simple/.github/workflows/security-scans-v2.yml@543ff89c2ce6ef4230c9a55654f03ed7831229e4
    with:
      languages: "[{\"language\":\"actions\",\"build-mode\":\"none\"},{\"language\":\"csharp\",\"build-mode\":\"none\"},{\"language\":\"python\",\"build-mode\":\"none\"}]"
      codeql_note: ""

name: Security baseline
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "2 14 * * 6"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: security-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  baseline:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    uses: securelyprogramming/centralized-actions-simple/.github/workflows/security-baseline.yml@3cdac835375bc0daecd8b0c8f9ccf8817ad6adcb
    with:
      enable_secrets: false
      enable_vuln: false
      enable_config: true
      enable_actions: true
